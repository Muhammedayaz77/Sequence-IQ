name: Native Mobile Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - run: gradle assembleDebug

  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -project "SequenceIQ.xcodeproj" -scheme "Sequence IQ" -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
